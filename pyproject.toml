[project]
name = "maesglas"
version = "2026.10.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "fonttools==4.60.2",
  "ruff==0.14.2",
  "mypy==1.18.2",
  "codespell==2.4.3",
  "jsonschema==4.25.1",
  "types-jsonschema==4.25.1.20251009",
  "uharfbuzz==0.57.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "N", "ANN"]

[tool.mypy]
strict = true
files = ["scripts", "tests"]
mypy_path = "scripts/typings"

[tool.pyright]
include = ["scripts", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
extraPaths = ["scripts"]
stubPath = "scripts/typings"
venvPath = "."
venv = ".venv"

[tool.ruff.lint.per-file-ignores]
"scripts/outline_face.py" = ["N802"]
"scripts/typings/**" = ["N802", "N815"]

[tool.codespell]
skip = "./.git,./.cache,./.venv,./node_modules,./styles,./uv.lock,./package-lock.json,./identity/letterforms.json"
ignore-words-list = "maes,shale,nd,ans,ot,tt"
